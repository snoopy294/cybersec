services:
  - type: web
    name: sentinel-api
    env: docker
    plan: free
    rootDir: backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        sync: false
      # Free Neon Postgres connection string (Render's free Postgres expires).
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_BACKEND
        value: minio
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET
        sync: false
      - key: MINIO_SECURE
        value: true
      - key: SECRET_KEY
        generateValue: true
      - key: USE_CELERY
        value: false
      # Set in the dashboard: true only while creating your accounts, then false.
      # sync: false keeps a Blueprint sync from reopening signups.
      - key: ALLOW_REGISTRATION
        sync: false
      - key: EXPOSE_API_DOCS
        value: false
      # Keep in step with the frontend proxy body cap in next.config.js.
      - key: MAX_FILE_SIZE_MB
        value: 12
      # Render's proxy is the one hop in front of the API.
      - key: TRUSTED_PROXY_HOPS
        value: 1
