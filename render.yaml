services:
  - type: web
    name: sentinel-api
    env: docker
    rootDir: backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_DIR
        value: /app/storage
      - key: SECRET_KEY
        generateValue: true
      - key: USE_CELERY
        value: false

databases:
  - name: sentinel-db
